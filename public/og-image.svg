<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090A0F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#27272A" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="80" y="80" width="320" height="40" rx="20" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
  <text x="240" y="106" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">OPEN-SOURCE PRIVACY SUITE</text>

  <!-- Title -->
  <text x="80" y="210" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">SovStack</text>

  <!-- Subtitle -->
  <text x="80" y="270" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#A1A1AA">Reclaim Your Digital Sovereignty</text>

  <text x="80" y="325" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#71717A">
    Curate your open-source privacy stack · Replace Google, Meta &amp; Microsoft with FOSS &amp; E2EE.
  </text>

  <!-- Three Pillar Pills -->
  <g transform="translate(80, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="70" rx="12" fill="#12141C" stroke="#27272A" stroke-width="1.5"/>
    <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">OPEN SOURCE</text>
    <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">MIT Licensed</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="70" rx="12" fill="#12141C" stroke="#27272A" stroke-width="1.5"/>
    <text x="264" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">COVERAGE</text>
    <text x="264" y="54" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">24 Categories</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="70" rx="12" fill="#12141C" stroke="#27272A" stroke-width="1.5"/>
    <text x="504" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#A78BFA" letter-spacing="1">PRIVACY</text>
    <text x="504" y="54" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Zero Telemetry</text>
  </g>

  <!-- Sovereign Stack Emblem (Right) -->
  <g transform="translate(860, 155) scale(4.8)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#12141C" stroke="#27272A" stroke-width="1.5"/>
    <path d="M17 39.5 L32 47.5 L47 39.5" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 31.5 L32 39.5 L47 31.5" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 16 L47 24 L32 32 L17 24 Z" fill="url(#shieldGrad)" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M19 23.6 L32 16.8 L45 23.6" fill="none" stroke="#ECFDF5" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
    <path d="M32 20.2 L37.8 23.3 L32 26.4 L26.2 23.3 Z" fill="#064E3B" opacity="0.35"/>
  </g>

  <!-- Footer URL -->
  <text x="80" y="555" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#52525B">abdullahon2006.github.io/sovstack · MIT License</text>
</svg>
