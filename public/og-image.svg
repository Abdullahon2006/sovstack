<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090A0F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#27272A" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="80" y="80" width="340" height="40" rx="20" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
  <text x="250" y="106" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">OPEN-SOURCE PRIVACY SUITE</text>

  <!-- Title -->
  <text x="80" y="210" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">DeGigamon</text>

  <!-- Subtitle -->
  <text x="80" y="270" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#A1A1AA">Break Free From Data-Collecting Gigamons</text>

  <text x="80" y="325" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#71717A">
    The client-side alternative to PrivacyPack.org · Replace Google, Meta &amp; Microsoft with FOSS &amp; E2EE.
  </text>

  <!-- Three Pillar Pills -->
  <g transform="translate(80, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="70" rx="12" fill="#12141C" stroke="#27272A" stroke-width="1.5"/>
    <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">ARCHITECTURAL</text>
    <text x="24" y="54" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">100% Client-Side</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="70" rx="12" fill="#12141C" stroke="#27272A" stroke-width="1.5"/>
    <text x="264" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">EXPANSIVE</text>
    <text x="264" y="54" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">24 Categories</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="70" rx="12" fill="#12141C" stroke="#27272A" stroke-width="1.5"/>
    <text x="504" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#A78BFA" letter-spacing="1">RESPECT</text>
    <text x="504" y="54" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Zero Telemetry</text>
  </g>

  <!-- Giant Shield Emblem (Right) -->
  <g transform="translate(880, 150)">
    <path d="M120 0L0 50v140c0 120 80 230 120 260 40-30 120-140 120-260V50L120 0z" fill="url(#shieldGrad)"/>
    <path d="M120 40l80 35v115c0 85-55 160-80 185-25-25-80-100-80-185V75l80-35z" fill="#090A0F" opacity="0.4"/>
    <polyline points="75,200 105,235 165,155" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer URL -->
  <text x="80" y="555" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#52525B">degigamon.org · MIT License</text>
</svg>
